services:
  - type: web
    name: usdidr-scraper-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: RUN_POLLER_IN_APP
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.10.11
